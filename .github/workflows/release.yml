name: Release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  ci:
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read
    secrets:
      GH_APP_CREDS: ${{ secrets.GH_APP_CREDS }}
      PAT: ${{ secrets.PAT }}

  release:
    name: release
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run semantic release
        uses: electron/semantic-trusted-release@672a62fe17fce21a0d10de5a6825ee54817af317 # v1.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
